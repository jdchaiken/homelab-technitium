---
# cloud-config
# Place this file in Proxmox under:
# /var/lib/vz/snippets/technitium-user.yaml
# Install VM with:
# - qm set <VMID> --cicustom "user=local:snippets/technitium-user.yaml" --net0 virtio,bridge=Servers

hostname: technitium
fqdn: technitium.example.com

# --- SSH Access ---
ssh_authorized_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAJRRCwwPwP8t7LeT1ywCBMzn/y+aebmzKqCEtowOYrj admin@example.com"

# --- Packages required before Ansible ---
packages:
  - python3
  - python3-pip
  - git
  - curl
  - wget
  - ca-certificates
  - bw-cli

# --- System configuration ---
timezone: America/New_York

# --- Networking (static IP for Technitium) ---
network:
  version: 2
  ethernets:
    ens18:
      dhcp4: false
      addresses:
        - 172.16.100.6/24
      gateway4: 172.16.100.1
      nameservers:
        addresses:
          - 172.16.100.1

# --- Write GitOps directory structure (optional) ---
write_files:
  - path: /opt/infra/.gitkeep
    content: ""

# --- Install Ansible + run Technitium playbook ---
runcmd:
  - apt-get update -y
  - apt-get upgrade -y

  - pip3 install ansible

  - curl -L "https://vault.bitwarden.com/download/?app=cli&platform=linux" -o /usr/local/bin/bw
  - chmod +x /usr/local/bin/bw

  - cp /etc/pve/technitium/bw.env /root/bw.env
  - chmod 600 /root/bw.env
  - export $(cat /root/bw.env | xargs)
  - bw login --apikey
  - bw unlock "$BW_PASSWORD" --raw > /root/bw_session

  - git clone https://gitea.example.com/example-org/technitium.git /opt/infra

  - ansible-playbook /opt/infra/technitium/install-technitium.yaml
  - ansible-playbook /opt/infra/technitium/configure-technitium.yaml

# --- Final message ---
final_message: "Technitium DNS Server bootstrapped via cloud-init + Ansible."
