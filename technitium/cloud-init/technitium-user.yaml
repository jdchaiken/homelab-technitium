#cloud-config
hostname: technitium
fqdn: technitium.example.com

ssh_authorized_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAJRRCwwPwP8t7LeT1ywCBMzn/y+aebmzKqCEtowOYrj admin@example.com

ssh_pwauth: true
disable_root: false

chpasswd:
  expire: false

packages:
  - qemu-guest-agent
  - python3
  - python3-pip
  - git
  - curl
  - wget
  - ca-certificates
  - ansible
  - jq
  - unzip

timezone: America/New_York

write_files:
  - path: /opt/infra/.gitkeep
    content: ""

  ###########################################################################
  # Technitium default admin password (required for API bootstrap)
  ###########################################################################
  - path: /etc/technitium/default-admin-password
    content: |
      admin
    permissions: "0600"

runcmd:
  - apt-get update -y || true
  - apt-get upgrade -y || true
  - systemctl enable qemu-guest-agent || true
  - systemctl start qemu-guest-agent || true

  ###########################################################################
  # Copy Bitwarden env file from Proxmox host into VM
  ###########################################################################
  - /usr/bin/qemu-ga --fsfreeze-freeze || true
  - /usr/bin/qemu-ga --file-read /etc/pve/technitium/bw.env > /root/bw.env || true
  - /usr/bin/qemu-ga --fsfreeze-thaw || true
  - chmod 600 /root/bw.env || true

  ###########################################################################
  # Ensure Technitium DNS service is enabled and started
  ###########################################################################
  - systemctl enable technitium-dns.service || true
  - systemctl start technitium-dns.service || true

  ###########################################################################
  # Clone your GitOps repo
  ###########################################################################
  - git clone https://gitea.example.com/example-org/technitium.git /opt/infra/technitium || true

  ###########################################################################
  # Run your Technitium Ansible playbooks
  ###########################################################################
  - ansible-playbook /opt/infra/technitium/technitium/ansible/install-technitium.yaml || true
  - ansible-playbook /opt/infra/technitium/technitium/ansible/configure-technitium.yaml || true

final_message: "Technitium DNS Server base image initialized via cloud-init."
