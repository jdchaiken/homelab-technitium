#cloud-config
hostname: technitium
fqdn: technitium.example.com

ssh_authorized_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAJRRCwwPwP8t7LeT1ywCBMzn/y+aebmzKqCEtowOYrj admin@example.com

ssh_pwauth: true
disable_root: false

chpasswd:
  expire: false

packages:
  - qemu-guest-agent
  - python3
  - python3-pip
  - git
  - curl
  - wget
  - ca-certificates
  - ansible

timezone: America/New_York

write_files:
  - path: /opt/infra/.gitkeep
    content: ""

runcmd:
  - apt-get update -y || true
  - apt-get upgrade -y || true
  - systemctl enable qemu-guest-agent || true
  - systemctl start qemu-guest-agent || true

  # Clone your GitOps repo
  - git clone https://gitea.example.com/example-org/technitium.git /opt/infra || true

  # Run your Technitium Ansible playbook
  - ansible-playbook /opt/infra/technitium/technitium/ansible/install-technitium.yaml || true
  - ansible-playbook /opt/infra/technitium/technitium/ansible/configure-technitium.yaml || true

final_message: "Technitium DNS Server base image initialized via cloud-init."
