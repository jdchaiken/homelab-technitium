# cloud-config
hostname: technitium
fqdn: technitium.example.com

# --- SSH Access ---
ssh_authorized_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAJRRCwwPwP8t7LeT1ywCBMzn/y+aebmzKqCEtowOYrj admin@example.com"

# --- Root password for console + SSH password login ---
chpasswd:
  list: |
    root:Salient2024!
  expire: False
ssh_pwauth: True

# --- Packages required before Ansible ---
packages:
  - qemu-guest-agent
  - python3
  - python3-pip
  - git
  - curl
  - wget
  - ca-certificates

# --- System configuration ---
timezone: America/New_York

# --- Networking (static IP for Technitium) ---
network:
  version: 2
  ethernets:
    ens18:
      dhcp4: false
      addresses:
        - 172.16.100.6/24
      gateway4: 172.16.100.1
      nameservers:
        addresses:
          - 172.16.100.1

# --- Write GitOps directory structure (optional) ---
write_files:
  - path: /opt/infra/.gitkeep
    content: ""

# --- Install Ansible + run Technitium playbook ---
runcmd:
  - apt-get update -y
  - apt-get upgrade -y

  - pip3 install ansible

  # Install Bitwarden CLI manually (correct method)
  - curl -L "https://vault.bitwarden.com/download/?app=cli&platform=linux" -o /usr/local/bin/bw
  - chmod +x /usr/local/bin/bw

  - cp /etc/pve/technitium/bw.env /root/bw.env
  - chmod 600 /root/bw.env
  - export $(cat /root/bw.env | xargs)
  - bw login --apikey
  - bw unlock "$BW_PASSWORD" --raw
