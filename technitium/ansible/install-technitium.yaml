---
- name: Install Technitium DNS Server on Debian 13
  hosts: localhost
  become: true

  vars_files:
    - vars/common.yml

  vars:
    technitium_installer: "https://download.technitium.com/dns/install.sh"

  tasks:
    ###########################################################################
    # BASE PACKAGES
    ###########################################################################
    - name: Ensure required packages are installed
      apt:
        name:
          - curl
          - wget
          - ca-certificates
        state: present
        update_cache: true

    ###########################################################################
    # RESTORE DNS BEFORE RUNNING INSTALLER
    ###########################################################################
    - name: Restore working DNS resolver
      copy:
        dest: /etc/resolv.conf
        content: |
          nameserver {{ bootstrap_resolver_ip }}

    ###########################################################################
    # INSTALL BITWARDEN CLI
    ###########################################################################
    - name: Download Bitwarden Secrets Manager CLI (AMD64)
      get_url:
        url: "https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-gnu-2.1.0.zip"
        dest: "/tmp/bws.zip"
        mode: "0644"

    - name: Extract BWS CLI
      unarchive:
        src: "/tmp/bws.zip"
        dest: "/usr/local/bin/"
        remote_src: true

    - name: Ensure BWS CLI is executable
      file:
        path: "/usr/local/bin/bws"
        mode: "0755"

    ###########################################################################
    # RUN TECHNITIUM INSTALLER
    ###########################################################################
    - name: Download and run official Technitium installer
      shell: |
        curl -sSL {{ technitium_installer }} | bash
      args:
        executable: /bin/bash

    ###########################################################################
    # VALIDATE + ENSURE SYSTEMD SERVICE
    # The official installer already creates and starts its own hardened
    # dns.service unit (unprivileged dns-server user, systemd sandboxing).
    # Do not install a second unit here -- an earlier revision of this
    # playbook shipped a separate root-run technitium.service pointed at the
    # same binary, and it lost the race for port 5380 against dns.service,
    # crash-looping forever (start-limit-hit).
    ###########################################################################
    - name: Check if Technitium systemd unit exists
      stat:
        path: /etc/systemd/system/dns.service
      register: technitium_unit

    - name: Enable and start Technitium service
      systemd:
        name: dns.service
        enabled: true
        state: started

    ###########################################################################
    # CONFIRM INSTALLATION
    ###########################################################################
    - name: Confirm installation
      debug:
        msg: "Technitium DNS Server installed and running via official installer."
