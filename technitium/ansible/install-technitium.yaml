---
- name: Install Technitium DNS Server on Debian 13
  hosts: localhost
  become: true

  vars:
    technitium_version: "10.0.0"
    technitium_arch: "linux_x64"
    technitium_install_dir: "/opt/technitium"
    technitium_url: "https://github.com/TechnitiumSoftware/DnsServer/releases/download/v{{ technitium_version }}/DnsServer_v{{ technitium_version }}_{{ technitium_arch }}.tar.gz"

  tasks:
    - name: Ensure required packages are installed
      apt:
        name:
          - curl
          - wget
          - ca-certificates
          - systemd
          - tar
        state: present
        update_cache: true

    - name: Ensure Technitium install directory exists
      file:
        path: "{{ technitium_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Technitium DNS Server tarball
      get_url:
        url: "{{ technitium_url }}"
        dest: "{{ technitium_install_dir }}/DnsServer.tar.gz"
        mode: "0644"

    - name: Extract Technitium DNS Server
      unarchive:
        src: "{{ technitium_install_dir }}/DnsServer.tar.gz"
        dest: "{{ technitium_install_dir }}"
        remote_src: true

    - name: Ensure Technitium directories exist
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/dns
        - /var/lib/dns
        - /var/log/dns

    - name: Create systemd unit for Technitium DNS Server
      copy:
        dest: /etc/systemd/system/dns.service
        mode: "0644"
        content: |
          [Unit]
          Description=Technitium DNS Server
          After=network.target

          [Service]
          WorkingDirectory={{ technitium_install_dir }}
          ExecStart={{ technitium_install_dir }}/DnsServer
          Restart=always
          RestartSec=5
          User=root
          Group=root

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      systemd:
        daemon_reload: true

    - name: Enable Technitium DNS Server service
      systemd:
        name: dns.service
        enabled: true

    - name: Start Technitium DNS Server service
      systemd:
        name: dns.service
        state: started

    - name: Clean up installer tarball
      file:
        path: "{{ technitium_install_dir }}/DnsServer.tar.gz"
        state: absent

    - name: Confirm installation
      debug:
        msg: "Technitium DNS Server {{ technitium_version }} installed and running."
