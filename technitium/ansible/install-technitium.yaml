---
- name: Install Technitium DNS Server on Debian 13
  hosts: localhost
  become: true

  tasks:
    ###########################################################################
    # BASE PACKAGES REQUIRED BEFORE ANYTHING ELSE
    ###########################################################################
    - name: Ensure required packages are installed
      apt:
        name:
          - curl
          - wget
          - ca-certificates
        state: present
        update_cache: true

    ###########################################################################
    # INSTALL BITWARDEN CLI (bw)
    ###########################################################################
    - name: Download Bitwarden CLI
      get_url:
        url: "https://vault.bitwarden.com/download/?app=cli&platform=linux"
        dest: /usr/local/bin/bw
        mode: "0755"

    ###########################################################################
    # INSTALL TECHNITIUM DNS SERVER
    ###########################################################################
    - name: Download and run official Technitium installer
      shell: |
        curl -sSL https://download.technitium.com/dns/install.sh | bash
      args:
        executable: /bin/bash

    ###########################################################################
    # ENABLE + START TECHNITIUM SERVICE
    ###########################################################################
    - name: Ensure Technitium service is enabled and started
      systemd:
        name: technitium.service
        enabled: true
        state: started

    ###########################################################################
    # CONFIRM INSTALLATION
    ###########################################################################
    - name: Confirm installation
      debug:
        msg: "Technitium DNS Server installed and running via official installer."
