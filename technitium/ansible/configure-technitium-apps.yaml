# Optional Technitium DNS Apps + SSO + OPNsense TSIG sync.
#
# Auto PTR and Weighted Round Robin (below) are LIVE -- wired into
# technitium/terraform/main.tf's remote-exec chain, right after
# configure-technitium-tls.yaml, so they install on every rebuild.
# Everything else in this file is still a commented-out scaffold. To enable
# another app:
#   1. Uncomment it (strip the leading "#" from each line, keeping the rest
#      of the line -- e.g. `sed -i 's/^#//' this_file.yaml` on a copy, or
#      your editor's "toggle block comment").
#   2. Fill in the placeholder values (domains, URLs, thresholds) for real.
#   3. Add any new secrets to /etc/pve/technitium/bw.env on the Proxmox host
#      (see secrets/bw.env.sample) -- NEVER hardcode a real secret here.
#   4. It'll then run automatically on the next rebuild via main.tf, or run
#      it by hand against an already-deployed instance:
#        ansible-playbook technitium/ansible/configure-technitium-apps.yaml
#
# technitium_url below is https://127.0.0.1:8443, not the stock
# localhost:5380 -- this file runs AFTER configure-technitium-tls.yaml,
# which moves the web console off the default port.
#
# Store URLs, install/config API endpoints, and every default config JSON
# shown below were verified live against a running Technitium 15.3 instance
# on 2026-07-10 (installed each app for real, pulled its actual
# /api/apps/config/get default, then uninstalled it again) -- not guessed
# from API docs alone. See configure-technitium.yaml for the API quirks
# this whole repo already learned the hard way (Bearer auth, form-urlencoded
# bodies, multipart fields needing an explicit filename, etc.) -- the same
# patterns are reused here.
#
# Secrets used below, and the bw.env keys they read (add these to bw.env
# only for the feature(s) you actually enable):
#   TECHNITIUM_QUERYLOGS_PG_CONFIG     -- single JSON secret for Query Logs'
#                                          PostgreSQL connection, see that
#                                          section below for its shape
#   TECHNITIUM_FAILOVER_SMTP_PASSWORD  -- Failover app's SMTP alert password
#   TECHNITIUM_LOGEXPORTER_HTTP_TOKEN  -- Log Exporter's HTTP sink auth token
#   TECHNITIUM_SSO_CONFIG              -- single JSON secret for SSO, see the
#                                          SSO section below for its shape
#   OPNSENSE_API_CONFIG                -- single JSON secret for the OPNsense
#                                          TSIG sync, see that section below
#
# Auto PTR and Weighted Round Robin need no config at all (confirmed live:
# GET config returns "#This app requires no config."). Advanced Blocking's
# example config below has no secrets, just block list URLs.
#
# SSO is a core Administration feature, not a DNS App -- no install step,
# just a config call. Its four values (authority, client ID, client secret,
# group map) come from ONE JSON-encoded bw.env secret instead of four
# separate keys, to keep this down to a single secret lookup -- see the SSO
# section below for the exact bw.env line shape.
#
# The OPNsense TSIG sync is not a Technitium feature at all -- it configures
# OPNsense's Kea DHCP DDNS settings so DHCP leases get registered into
# Technitium via authenticated dynamic DNS updates, reusing the TSIG key
# configure-technitium.yaml already generated (fetched from Bitwarden by
# name, not regenerated). Field/endpoint names come from OPNsense's own
# source, not guesswork, but this section is the one part of this file that
# was NOT live-tested end-to-end (no OPNsense instance available) -- see
# its own comment block for exactly what to confirm before trusting it.
#
---
- name: Configure optional Technitium DNS Apps
  hosts: localhost
  become: true
  gather_facts: false

  vars:
    # Unlike configure-technitium.yaml and configure-technitium-tls.yaml
    # (which run earlier and correctly use the stock HTTP port before it's
    # changed), this file is meant to run AFTER configure-technitium-tls.yaml
    # -- which moves the web console to webServiceHttpPort 80 (redirect-only)
    # / webServiceTlsPort 8443. localhost:5380 is no longer listening at all
    # by that point. 127.0.0.1 (not the real hostname) is deliberate too --
    # the cert's SAN is ns1.example.com, which will never match a loopback
    # IP, hence validate_certs: false on the uri tasks below rather than
    # relying on DNS resolution being warm this early.
    technitium_url: "https://127.0.0.1:8443"
    technitium_api: "{{ technitium_url }}/api"
    technitium_admin_user: "admin"
    # Used by the OPNsense DDNS/TSIG sync section near the end of this file.
    technitium_dns_server_ip: "172.16.100.6"
    dns_forward_zone: "example.com."

  tasks:
    ###########################################################################
    # AUTH -- same pattern as configure-technitium.yaml: read bw.env for the
    # admin password, log in, get a session token. If you chain this file
    # after configure-technitium.yaml in the same ansible-playbook run
    # instead, you can drop this block and reuse technitium_api_key instead
    # of technitium_session_token in the tasks below.
    ###########################################################################
    - name: Read Bitwarden environment file
      set_fact:
        bw_env_raw: "{{ lookup('file', '/root/bw.env') }}"
      no_log: true

    - name: Parse secrets needed by DNS Apps below
      # Auto PTR and Weighted Round Robin need no config at all, so only the
      # admin password (already required for login) is parsed here. Add the
      # other apps' regex_search lines back only once you also enable them
      # and their bw.env keys actually exist -- otherwise `| first` on a
      # missing key raises an error.
      set_fact:
        technitium_admin_password: "{{ bw_env_raw | regex_search('TECHNITIUM_ADMIN_PASSWORD=\"?([^\"\\n]+)\"?', '\\1') | first }}"
      no_log: true

    - name: Log in to Technitium
      uri:
        url: "{{ technitium_api }}/user/login"
        method: POST
        validate_certs: false
        body_format: form-urlencoded
        body:
          user: "{{ technitium_admin_user }}"
          pass: "{{ technitium_admin_password }}"
        status_code: 200
      register: apps_login
      no_log: true

    - name: Extract session token
      set_fact:
        technitium_session_token: "{{ apps_login.json.token }}"
      no_log: true

    ###########################################################################
    # AUTO PTR -- generates PTR records automatically for A/AAAA records in
    # primary/forwarder zones. Confirmed live: this app has no config file
    # at all (GET config returns "#This app requires no config.").
    ###########################################################################
    - name: Install Auto PTR app
      uri:
        url: "{{ technitium_api }}/apps/downloadAndInstall"
        method: POST
        validate_certs: false
        headers:
          Authorization: "Bearer {{ technitium_session_token }}"
        body_format: form-urlencoded
        body:
          name: "Auto PTR"
          url: "https://download.technitium.com/dns/apps/AutoPtrApp-v5.zip"
        status_code: 200

    ###########################################################################
    # WEIGHTED ROUND ROBIN -- APP records that distribute answers across
    # multiple IPs by weight. Also no config file (confirmed live).
    ###########################################################################
    - name: Install Weighted Round Robin app
      uri:
        url: "{{ technitium_api }}/apps/downloadAndInstall"
        method: POST
        validate_certs: false
        headers:
          Authorization: "Bearer {{ technitium_session_token }}"
        body_format: form-urlencoded
        body:
          name: "Weighted Round Robin"
          url: "https://download.technitium.com/dns/apps/WeightedRoundRobinApp-v5.zip"
        status_code: 200
