---
- name: Configure Technitium as a Secondary DNS server (ns2)
  hosts: localhost
  become: true
  gather_facts: false

  vars_files:
    - vars/common.yml

  vars:
    technitium_url: "http://localhost:5380"
    technitium_api: "{{ technitium_url }}/api"
    technitium_admin_user: "admin"
    # Overridden via -e from ns2.tf's remote-exec chain; default here only
    # matters when running this playbook by hand.
    dns_hostname: "ns2.example.com"
    # technitium_dns_server_ip (ns1's stable IP, the primary every Secondary
    # zone below transfers from) and zone_dir come from vars/common.yml.

  tasks:
    ###########################################################################
    # 1. WAIT FOR TECHNITIUM API
    ###########################################################################
    - name: Wait for Technitium API to become available
      uri:
        url: "{{ technitium_api }}/status"
        method: GET
        status_code: 200
      register: api_status
      retries: 20
      delay: 3
      until: api_status.status == 200

    ###########################################################################
    # 2. LOAD BITWARDEN CREDENTIALS
    ###########################################################################
    - name: Read Bitwarden environment file
      set_fact:
        bw_env_raw: "{{ lookup('file', '/root/bw.env') }}"
      no_log: true

    - name: Parse initial admin password
      # No TSIG/Bitwarden-secret parsing needed here -- see the note on the
      # zone-creation task below for why ns2 doesn't need a TSIG key at all.
      set_fact:
        technitium_admin_password: "{{ bw_env_raw | regex_search('TECHNITIUM_ADMIN_PASSWORD=\"?([^\"\\n]+)\"?', '\\1') | first }}"
      no_log: true

    ###########################################################################
    # 3. LOGIN WITH DEFAULT PASSWORD (admin/admin)
    ###########################################################################
    - name: Login to Technitium with default password
      uri:
        url: "{{ technitium_api }}/user/login"
        method: POST
        body_format: form-urlencoded
        body:
          user: "{{ technitium_admin_user }}"
          pass: "admin"
        status_code: 200
      register: login_default

    - name: Extract default session token
      set_fact:
        technitium_session_token_default: "{{ login_default.json.token }}"
      no_log: true

    ###########################################################################
    # 4. CHANGE ADMIN PASSWORD
    ###########################################################################
    - name: Change Technitium admin password
      uri:
        url: "{{ technitium_api }}/user/changePassword"
        method: POST
        headers:
          Authorization: "Bearer {{ technitium_session_token_default }}"
        body_format: form-urlencoded
        body:
          pass: "admin"
          newPass: "{{ technitium_admin_password }}"
        status_code: 200
      no_log: true

    ###########################################################################
    # 5. LOGIN AGAIN WITH NEW PASSWORD
    ###########################################################################
    - name: Login with new password
      uri:
        url: "{{ technitium_api }}/user/login"
        method: POST
        body_format: form-urlencoded
        body:
          user: "{{ technitium_admin_user }}"
          pass: "{{ technitium_admin_password }}"
        status_code: 200
      register: login_new
      no_log: true

    - name: Extract new session token
      set_fact:
        technitium_session_token: "{{ login_new.json.token }}"
      no_log: true

    ###########################################################################
    # 6. CREATE PERMANENT ANSIBLE API KEY
    ###########################################################################
    - name: Create Technitium API key for Ansible
      uri:
        url: "{{ technitium_api }}/user/createToken"
        method: POST
        headers:
          Authorization: "Bearer {{ technitium_session_token }}"
        body_format: form-urlencoded
        body:
          tokenName: "ansible"
        status_code: 200
      register: api_key_create
      no_log: true

    - name: Extract new Technitium API key
      set_fact:
        technitium_api_key: "{{ api_key_create.json.token }}"
      no_log: true

    ###########################################################################
    # 7. CONFIGURE RESOLVER AND LOGGING
    # Same loopback-inclusive recursionNetworkACL as ns1/configure-
    # technitium.yaml -- must run before the Bitwarden fetch below, same
    # reasoning: bws resolving identity.bitwarden.com goes through this box's
    # own loopback resolver, and UseSpecifiedNetworkACL does not implicitly
    # trust loopback.
    ###########################################################################
    - name: Configure resolver and logging
      # dnssecValidation: false -- see the matching comment on ns1's
      # "Configure resolver, ACLs, and logging" task in
      # configure-technitium.yaml for why: Technitium's own DNSSEC
      # validator broke split-DNS conditional forwarding outright when
      # this was true, confirmed live, regardless of the per-FWD-record
      # dnssecValidation=false already set on each zone.
      uri:
        url: "{{ technitium_api }}/settings/set"
        method: POST
        headers:
          Authorization: "Bearer {{ technitium_api_key }}"
        body_format: form-urlencoded
        body:
          dnsServerDomain: "{{ dns_hostname }}"
          forwarders: "{{ upstream_resolver_ip }}"
          dnssecValidation: false
          recursion: "UseSpecifiedNetworkACL"
          recursionNetworkACL: "{{ recursion_network_acl }}"
          zoneTransferAllowedNetworks: "{{ zone_transfer_allowed_networks }}"
          logQueries: true
        status_code: 200
      no_log: true

    ###########################################################################
    # 8. CREATE SECONDARY FORWARDER ZONES
    # Field names verified directly against Technitium's own source
    # (DnsServerCore/WebServiceZonesApi.cs, CreateZoneAsync's
    # AuthZoneType.SecondaryForwarder case) rather than guessed:
    #   zone, type=SecondaryForwarder, primaryNameServerAddresses
    # zoneTransferProtocol defaults to Tcp when omitted, which is what we
    # want here. Same three zone names configure-technitium.yaml now
    # imports as Forwarder (Conditional Forwarder) zones on ns1 -- ns2 must
    # mirror them as SecondaryForwarder, not plain Secondary: a plain
    # Secondary zone transfers ns1's records fine but has no concept of the
    # FWD record, so ns2 would silently lose the split-DNS fallthrough
    # behavior entirely (NXDOMAIN for anything not explicitly in the zone,
    # same as before this zone type existed) despite the transfer itself
    # succeeding. Not live-tested as of this writing -- validate via
    # `make deploy-staging` alongside ns1's Forwarder zone change before
    # trusting this on production.
    #
    # Deliberately NOT passing tsigKeyName here, even though ns1 has a TSIG
    # key configured globally -- confirmed live (created this same zone on
    # ns2 both ways) that passing tsigKeyName makes the transfer fail
    # silently: ns1's per-zone zoneTransferTsigKeyNames is empty (it was
    # never granted for this key), so a TSIG-signed transfer request gets
    # rejected even though the key exists in ns1's global tsigKeys list --
    # global tsigKeys and per-zone zone-transfer TSIG authorization are two
    # separate things in Technitium. Omitting tsigKeyName falls back to
    # ns1's existing zoneTransfer policy (AllowOnlyZoneNameServers, the
    # default) -- a plain IP-based check against the zone's own NS records,
    # which already succeeds once ns2 is a real NS record for the zone.
    # This default is unchanged by the Forwarder zone conversion: Forwarder
    # zones only disallow *explicitly setting* AllowOnlyZoneNameServers via
    # the API, they don't change what a freshly created zone's transfer
    # policy defaults to, and this repo never explicitly sets it either way.
    #
    # No NOTIFY configuration needed on ns1's side either: its zones/options
    # default to notify="ZoneNameServers", which (per the zone's own NS
    # records) picks up ns2 automatically -- confirmed live via a real
    # instance's zones/options/get, not assumed.
    ###########################################################################
    - name: Discover zone files
      find:
        paths: "{{ zone_dir }}"
        patterns: "*.zone"
      register: zone_files_found

    - name: Compute zone names from discovered zone files
      set_fact:
        zone_names: "{{ zone_files_found.files | map(attribute='path') | map('basename') | map('regex_replace', '\\.zone$', '') | sort | list }}"

    - name: Create Secondary Forwarder zones transferring from ns1
      loop: "{{ zone_names }}"
      loop_control:
        label: "{{ item }}"
      uri:
        url: "{{ technitium_api }}/zones/create?zone={{ item }}&type=SecondaryForwarder&primaryNameServerAddresses={{ technitium_dns_server_ip }}"
        method: POST
        headers:
          Authorization: "Bearer {{ technitium_api_key }}"
        status_code: 200

    - name: Confirm configuration applied
      debug:
        msg: "Technitium configured as a Secondary Forwarder DNS server (ns2), transferring {{ zone_names | join('/') }} from {{ technitium_dns_server_ip }}."
