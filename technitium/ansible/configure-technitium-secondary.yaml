---
- name: Configure Technitium as a Secondary DNS server (ns2)
  hosts: localhost
  become: true
  gather_facts: false

  vars:
    technitium_url: "http://localhost:5380"
    technitium_api: "{{ technitium_url }}/api"
    technitium_admin_user: "admin"
    # Overridden via -e from ns2.tf's remote-exec chain; default here only
    # matters when running this playbook by hand.
    dns_hostname: "ns2.example.com"
    # ns1's stable IP -- the primary every Secondary zone below transfers from.
    primary_dns_server_ip: "172.16.100.6"

  tasks:
    ###########################################################################
    # 1. WAIT FOR TECHNITIUM API
    ###########################################################################
    - name: Wait for Technitium API to become available
      uri:
        url: "{{ technitium_api }}/status"
        method: GET
        status_code: 200
      register: api_status
      retries: 20
      delay: 3
      until: api_status.status == 200

    ###########################################################################
    # 2. LOAD BITWARDEN CREDENTIALS
    ###########################################################################
    - name: Read Bitwarden environment file
      set_fact:
        bw_env_raw: "{{ lookup('file', '/root/bw.env') }}"
      no_log: true

    - name: Parse Bitwarden credentials and initial admin password
      set_fact:
        bw_token: "{{ bw_env_raw | regex_search('BW_TOKEN=\"?([^\"\\n]+)\"?', '\\1') | first }}"
        bw_projectid: "{{ bw_env_raw | regex_search('BW_PROJECTID=\"?([^\"\\n]+)\"?', '\\1') | first }}"
        technitium_admin_password: "{{ bw_env_raw | regex_search('TECHNITIUM_ADMIN_PASSWORD=\"?([^\"\\n]+)\"?', '\\1') | first }}"
      no_log: true

    ###########################################################################
    # 3. LOGIN WITH DEFAULT PASSWORD (admin/admin)
    ###########################################################################
    - name: Login to Technitium with default password
      uri:
        url: "{{ technitium_api }}/user/login"
        method: POST
        body_format: form-urlencoded
        body:
          user: "{{ technitium_admin_user }}"
          pass: "admin"
        status_code: 200
      register: login_default

    - name: Extract default session token
      set_fact:
        technitium_session_token_default: "{{ login_default.json.token }}"
      no_log: true

    ###########################################################################
    # 4. CHANGE ADMIN PASSWORD
    ###########################################################################
    - name: Change Technitium admin password
      uri:
        url: "{{ technitium_api }}/user/changePassword"
        method: POST
        headers:
          Authorization: "Bearer {{ technitium_session_token_default }}"
        body_format: form-urlencoded
        body:
          pass: "admin"
          newPass: "{{ technitium_admin_password }}"
        status_code: 200
      no_log: true

    ###########################################################################
    # 5. LOGIN AGAIN WITH NEW PASSWORD
    ###########################################################################
    - name: Login with new password
      uri:
        url: "{{ technitium_api }}/user/login"
        method: POST
        body_format: form-urlencoded
        body:
          user: "{{ technitium_admin_user }}"
          pass: "{{ technitium_admin_password }}"
        status_code: 200
      register: login_new
      no_log: true

    - name: Extract new session token
      set_fact:
        technitium_session_token: "{{ login_new.json.token }}"
      no_log: true

    ###########################################################################
    # 6. CREATE PERMANENT ANSIBLE API KEY
    ###########################################################################
    - name: Create Technitium API key for Ansible
      uri:
        url: "{{ technitium_api }}/user/createToken"
        method: POST
        headers:
          Authorization: "Bearer {{ technitium_session_token }}"
        body_format: form-urlencoded
        body:
          tokenName: "ansible"
        status_code: 200
      register: api_key_create
      no_log: true

    - name: Extract new Technitium API key
      set_fact:
        technitium_api_key: "{{ api_key_create.json.token }}"
      no_log: true

    ###########################################################################
    # 7. CONFIGURE RESOLVER AND LOGGING
    # Same loopback-inclusive recursionNetworkACL as ns1/configure-
    # technitium.yaml -- must run before the Bitwarden fetch below, same
    # reasoning: bws resolving identity.bitwarden.com goes through this box's
    # own loopback resolver, and UseSpecifiedNetworkACL does not implicitly
    # trust loopback.
    ###########################################################################
    - name: Configure resolver and logging
      uri:
        url: "{{ technitium_api }}/settings/set"
        method: POST
        headers:
          Authorization: "Bearer {{ technitium_api_key }}"
        body_format: form-urlencoded
        body:
          dnsServerDomain: "{{ dns_hostname }}"
          forwarders: "172.16.100.1"
          dnssecValidation: true
          recursion: "UseSpecifiedNetworkACL"
          recursionNetworkACL: "127.0.0.1/32,::1/128,172.16.0.0/12,192.168.200.0/20,192.168.0.0/17"
          zoneTransferAllowedNetworks: "172.16.0.0/12,192.168.200.0/20,192.168.0.0/17"
          logQueries: true
        status_code: 200
      no_log: true

    ###########################################################################
    # 8. FETCH PRODUCTION'S TSIG KEY FROM BITWARDEN BY NAME
    # ns2 has no reason to generate its own TSIG key: TSIG-authenticated zone
    # transfer needs both sides (ns1, the primary, and ns2, the secondary) to
    # hold the SAME key for the handshake, so this fetches the one ns1
    # already generated and wrote to Bitwarden -- same bws secret list +
    # selectattr pattern used for staging in configure-technitium.yaml and
    # for the OPNsense sync module in configure-technitium-apps.yaml. Never
    # writes anything back -- ns2 only reads this secret, never generates or
    # stores one.
    ###########################################################################
    - name: Fetch production's TSIG key from Bitwarden by name
      shell: |
        export BWS_ACCESS_TOKEN="{{ bw_token }}"
        bws secret list "{{ bw_projectid }}" -o json
      register: bw_secrets_raw
      changed_when: false
      no_log: true

    - name: Extract TSIG name/algorithm/secret from the Bitwarden secret list
      set_fact:
        tsig_key_name: "{{ (bw_secrets_raw.stdout | from_json | selectattr('key', 'equalto', 'externaldns-tsig-name') | map(attribute='value') | list | first) }}"
        tsig_algorithm: "{{ (bw_secrets_raw.stdout | from_json | selectattr('key', 'equalto', 'externaldns-tsig-algorithm') | map(attribute='value') | list | first) }}"
        tsig_secret: "{{ (bw_secrets_raw.stdout | from_json | selectattr('key', 'equalto', 'externaldns-tsig-secret') | map(attribute='value') | list | first) }}"
      no_log: true

    ###########################################################################
    # 9. APPLY TSIG KEY TO TECHNITIUM
    # Needed locally on ns2 too, not just ns1 -- TSIG-authenticated zone
    # transfer requires both sides to hold the same key to sign/verify the
    # transfer request.
    ###########################################################################
    - name: Apply TSIG key to Technitium settings
      uri:
        url: "{{ technitium_api }}/settings/set"
        method: POST
        headers:
          Authorization: "Bearer {{ technitium_api_key }}"
        body_format: form-urlencoded
        body:
          tsigKeys: "{{ tsig_key_name }}|{{ tsig_secret }}|{{ tsig_algorithm }}"
        status_code: 200
      no_log: true

    ###########################################################################
    # 10. CREATE SECONDARY ZONES
    # Field names verified directly against Technitium's own source
    # (DnsServerCore/WebServiceZonesApi.cs, CreateZoneAsync's
    # AuthZoneType.Secondary case) rather than guessed:
    #   zone, type=Secondary, primaryNameServerAddresses, tsigKeyName
    # zoneTransferProtocol defaults to Tcp when omitted, which is what we
    # want here. Same three zone names configure-technitium.yaml already
    # imports as Primary zones on ns1 -- ns2 mirrors all three as Secondary.
    #
    # No NOTIFY configuration needed on ns1's side: its zones/options default
    # to notify="ZoneNameServers", which (per the zone's own NS records)
    # picks up ns2 automatically once ns2's NS record is added to each zone
    # file -- confirmed this is the live default via a real instance's
    # zones/options/get, not assumed.
    ###########################################################################
    - name: Create Secondary zones transferring from ns1
      loop:
        - example.com
        - example.net
        - storage.example.com
      loop_control:
        label: "{{ item }}"
      uri:
        url: "{{ technitium_api }}/zones/create?zone={{ item }}&type=Secondary&primaryNameServerAddresses={{ primary_dns_server_ip }}&tsigKeyName={{ tsig_key_name }}"
        method: POST
        headers:
          Authorization: "Bearer {{ technitium_api_key }}"
        status_code: 200

    ###########################################################################
    # 11. RESTART SERVICE
    ###########################################################################
    - name: Restart Technitium DNS service
      systemd:
        name: dns.service
        state: restarted

    - name: Confirm configuration applied
      debug:
        msg: "Technitium configured as a Secondary DNS server (ns2), transferring example.com/example.net/storage.example.com from {{ primary_dns_server_ip }}."
