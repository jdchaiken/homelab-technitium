---
- name: Configure Technitium DNS Server declaratively (GitOps + Bitwarden)
  hosts: localhost
  become: true
  gather_facts: false

  vars_files:
    - vars/common.yml

  vars:
    technitium_url: "http://localhost:5380"
    technitium_api: "{{ technitium_url }}/api"
    technitium_admin_user: "admin"
    # Overridden via -e from main.tf's remote-exec chain; defaults here only
    # matter when running this playbook by hand.
    dns_hostname: "ns1.example.com"

  tasks:
    ###########################################################################
    # 1. WAIT FOR TECHNITIUM API
    ###########################################################################
    - name: Wait for Technitium API to become available
      uri:
        url: "{{ technitium_api }}/status"
        method: GET
        status_code: 200
      register: api_status
      retries: 20
      delay: 3
      until: api_status.status == 200

    ###########################################################################
    # 2. LOAD BITWARDEN CREDENTIALS
    # /root/bw.env is a shell-style KEY="value" file (see secrets/bw.env.sample),
    # not YAML, so pull fields out with regex_search instead of from_yaml.
    ###########################################################################
    - name: Read Bitwarden environment file
      set_fact:
        bw_env_raw: "{{ lookup('file', '/root/bw.env') }}"
      no_log: true

    - name: Parse Bitwarden credentials and initial admin password
      # regex_search() with a capture-group argument returns a list (even
      # with exactly one group), not a scalar -- `| first` unwraps it.
      # Left as a list, these render as Python repr ("['value']") wherever
      # they're interpolated into a plain string, e.g. the shell tasks below.
      set_fact:
        bw_token: "{{ bw_env_raw | regex_search('BW_TOKEN=\"?([^\"\\n]+)\"?', '\\1') | first }}"
        bw_projectid: "{{ bw_env_raw | regex_search('BW_PROJECTID=\"?([^\"\\n]+)\"?', '\\1') | first }}"
        technitium_admin_password: "{{ bw_env_raw | regex_search('TECHNITIUM_ADMIN_PASSWORD=\"?([^\"\\n]+)\"?', '\\1') | first }}"
      no_log: true

    ###########################################################################
    # 3. LOGIN WITH DEFAULT PASSWORD (admin/admin)
    # Every freshly built VM ships an unconfigured Technitium instance, so the
    # default credentials are always valid here. This playbook is not meant
    # to be re-run against an already-configured instance.
    #
    # NOTE: Technitium 15.0+ removed the old /api/login path and X-Auth-Token
    # header in favor of /api/user/login and an "Authorization: Bearer"
    # header (installed version here is 15.3). Endpoints below were verified
    # directly against a live instance, not just the API docs.
    ###########################################################################
    - name: Login to Technitium with default password
      uri:
        url: "{{ technitium_api }}/user/login"
        method: POST
        body_format: form-urlencoded
        body:
          user: "{{ technitium_admin_user }}"
          pass: "admin"
        status_code: 200
      register: login_default

    - name: Extract default session token
      set_fact:
        technitium_session_token_default: "{{ login_default.json.token }}"
      no_log: true

    ###########################################################################
    # 4. CHANGE ADMIN PASSWORD
    ###########################################################################
    - name: Change Technitium admin password
      uri:
        url: "{{ technitium_api }}/user/changePassword"
        method: POST
        headers:
          Authorization: "Bearer {{ technitium_session_token_default }}"
        body_format: form-urlencoded
        body:
          pass: "admin"
          newPass: "{{ technitium_admin_password }}"
        status_code: 200
      no_log: true

    ###########################################################################
    # 5. LOGIN AGAIN WITH NEW PASSWORD
    ###########################################################################
    - name: Login with new password
      uri:
        url: "{{ technitium_api }}/user/login"
        method: POST
        body_format: form-urlencoded
        body:
          user: "{{ technitium_admin_user }}"
          pass: "{{ technitium_admin_password }}"
        status_code: 200
      register: login_new
      no_log: true

    - name: Extract new session token
      set_fact:
        technitium_session_token: "{{ login_new.json.token }}"
      no_log: true

    ###########################################################################
    # 6. CREATE PERMANENT ANSIBLE API KEY
    ###########################################################################
    - name: Create Technitium API key for Ansible
      uri:
        url: "{{ technitium_api }}/user/createToken"
        method: POST
        headers:
          Authorization: "Bearer {{ technitium_session_token }}"
        body_format: form-urlencoded
        body:
          tokenName: "ansible"
        status_code: 200
      register: api_key_create
      no_log: true

    - name: Extract new Technitium API key
      set_fact:
        technitium_api_key: "{{ api_key_create.json.token }}"
      no_log: true

    ###########################################################################
    # 7. CONFIGURE RESOLVER, ACLs, AND LOGGING
    # Param names verified against a live 15.3 instance -- the field names
    # used by older Technitium API versions (RecursiveDnsServers,
    # EnableRecursion, AllowRecursionFrom, EnableQueryLogging, ...) no
    # longer exist.
    #
    # This MUST run before ANY Bitwarden network call below (both the
    # staging TSIG fetch right after this task, and the "Store ... in
    # Bitwarden" tasks further down). The installer points /etc/resolv.conf
    # at 127.0.0.1 (itself), so every system DNS lookup on this box
    # (including `bws` talking to identity.bitwarden.com, and `git pull`
    # resolving gitea.example.com) goes through Technitium's own
    # recursion ACL. UseSpecifiedNetworkACL does NOT implicitly trust
    # loopback -- confirmed live: with only the LAN CIDRs listed below,
    # queries sourced from 127.0.0.1 got SERVFAIL even though the exact
    # same query from another host on those same CIDRs worked fine.
    # 127.0.0.1/32 and ::1/128 have to be listed explicitly. tsigKeys is
    # deliberately NOT set here -- see the follow-up task below, once
    # tsig_key_name/tsig_secret/tsig_algorithm are actually known.
    ###########################################################################
    - name: Configure resolver, ACLs, and logging
      # dnssecValidation: false (not true) -- confirmed live 2026-07-16: with
      # it on, Technitium's own validator tries to build a DNSSEC chain up
      # from example.com (an unsigned, private zone never delegated from
      # the real public .com) for every forwarded/recursive answer, can't
      # find the expected DS record, and treats that as a possible spoofing
      # attack (cached as "FailureCache: ServerFailure; DnssecIndeterminate:
      # Attack detected! Unable to resolve DS for example.com") instead of
      # the correct "insecure delegation, skip validation" -- this happened
      # even with dnssecValidation=false already set on the zone's own FWD
      # record, so the global setting isn't overridden by the per-forwarder
      # flag for this check. Broke split-DNS conditional forwarding for all
      # three zones outright (SERVFAIL on any name not explicitly defined).
      # Trade-off: this also stops validating DNSSEC for external/public
      # lookups, not just internal ones -- accepted deliberately for an
      # internal resolver sitting behind Unbound, not an oversight.
      uri:
        url: "{{ technitium_api }}/settings/set"
        method: POST
        headers:
          Authorization: "Bearer {{ technitium_api_key }}"
        body_format: form-urlencoded
        body:
          dnsServerDomain: "{{ dns_hostname }}"
          forwarders: "{{ upstream_resolver_ip }}"
          dnssecValidation: false
          recursion: "UseSpecifiedNetworkACL"
          recursionNetworkACL: "{{ recursion_network_acl }}"
          zoneTransferAllowedNetworks: "{{ zone_transfer_allowed_networks }}"
          logQueries: true
          enableBlocking: "{{ enable_blocking }}"
          blockListUrls: "{{ technitium_block_list_urls }}"
        status_code: 200
      no_log: true

    ###########################################################################
    # 8. GENERATE TSIG KEY FOR RFC2136 UPDATES
    # Technitium has no server-side "create TSIG key" API that generates a
    # secret for you -- settings/set's tsigKeys parameter just stores
    # whatever name/secret/algorithm triple you give it (confirmed against
    # the API docs and a live instance), so the secret has to be generated
    # here.
    ###########################################################################
    - name: Generate TSIG shared secret
      when: not (is_staging | default(false) | bool)
      set_fact:
        tsig_key_name: "externaldns-key"
        tsig_algorithm: "hmac-sha256"
        tsig_secret: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"
      no_log: true

    ###########################################################################
    # 8b. STAGING: REUSE PRODUCTION'S REAL TSIG KEY INSTEAD OF GENERATING ONE
    # Staging has no separate ExternalDNS/OPNsense to test DDNS against, so
    # there's no reason for it to have its own TSIG key -- fetch production's
    # by name instead (same bws secret list + selectattr pattern already
    # used by configure-technitium-apps.yaml's OPNsense sync module).
    # bw_token/bw_projectid are already parsed earlier in this file. Safe to
    # hit the network here -- the previous task already opened loopback
    # recursion, unlike before this file's task ordering was fixed.
    ###########################################################################
    - name: Fetch production's TSIG key from Bitwarden by name
      when: is_staging | default(false) | bool
      shell: |
        export BWS_ACCESS_TOKEN="{{ bw_token }}"
        bws secret list "{{ bw_projectid }}" -o json
      register: bw_secrets_raw
      changed_when: false
      no_log: true

    - name: Extract TSIG name/algorithm/secret from the Bitwarden secret list
      when: is_staging | default(false) | bool
      set_fact:
        tsig_key_name: "{{ (bw_secrets_raw.stdout | from_json | selectattr('key', 'equalto', 'externaldns-tsig-name') | map(attribute='value') | list | first) }}"
        tsig_algorithm: "{{ (bw_secrets_raw.stdout | from_json | selectattr('key', 'equalto', 'externaldns-tsig-algorithm') | map(attribute='value') | list | first) }}"
        tsig_secret: "{{ (bw_secrets_raw.stdout | from_json | selectattr('key', 'equalto', 'externaldns-tsig-secret') | map(attribute='value') | list | first) }}"
      no_log: true

    ###########################################################################
    # 8c. APPLY TSIG KEY TO TECHNITIUM
    # Separate, smaller settings/set call (partial-update semantics, same as
    # every other settings/set call in this repo) -- split out from task 7
    # specifically so that task 7's recursion-ACL fix can run before either
    # TSIG path above needs the network.
    ###########################################################################
    - name: Apply TSIG key to Technitium settings
      uri:
        url: "{{ technitium_api }}/settings/set"
        method: POST
        headers:
          Authorization: "Bearer {{ technitium_api_key }}"
        body_format: form-urlencoded
        body:
          tsigKeys: "{{ tsig_key_name }}|{{ tsig_secret }}|{{ tsig_algorithm }}"
        status_code: 200
      no_log: true

    ###########################################################################
    # 9. STORE API KEY IN BITWARDEN
    # bws secret create is NOT idempotent -- it makes a new dated entry
    # every single run, with no update-if-exists behavior. Every rebuild was
    # leaving the previous run's entry behind, so the project accumulated a
    # new duplicate of every key on every deploy (confirmed live: 10 copies
    # each of technitium-ansible-api-key and the three externaldns-tsig-*
    # keys after 10 rebuilds). upsert_secret below looks up all existing
    # entries for the key by name (bws secret list, filtered client-side --
    # there's no server-side "get by name" in this bws CLI version, 2.1.0),
    # updates the first one in place with `bws secret edit --value`, and
    # deletes any others -- which also self-heals the existing duplicate
    # pileup down to one entry the next time this runs, no separate cleanup
    # script needed. Argument syntax for create/edit/delete verified live
    # against the installed bws CLI (`bws secret <cmd> --help`), not guessed.
    ###########################################################################
    - name: Store Technitium API key in Bitwarden
      when: not (is_staging | default(false) | bool)
      shell: |
        export BWS_ACCESS_TOKEN="{{ bw_token }}"

        upsert_secret() {
          local key="$1" value="$2"
          local ids
          ids=$(bws secret list "{{ bw_projectid }}" -o json | jq -r --arg key "$key" '.[] | select(.key == $key) | .id')

          if [ -z "$ids" ]; then
            bws secret create "$key" "$value" "{{ bw_projectid }}"
          else
            local first_id rest
            first_id=$(echo "$ids" | head -1)
            bws secret edit --value "$value" "$first_id"
            rest=$(echo "$ids" | tail -n +2)
            if [ -n "$rest" ]; then
              # shellcheck disable=SC2086
              bws secret delete $rest
            fi
          fi
        }

        upsert_secret "technitium-ansible-api-key" "{{ technitium_api_key }}"
      args:
        executable: /bin/bash
      no_log: true

    ###########################################################################
    # 10. STORE TSIG VALUES IN BITWARDEN
    # Staging skips this entirely -- it reused production's existing key
    # above rather than generating a new one, so there's nothing new to store.
    # Same upsert_secret pattern as task 9 (redefined here since each
    # Ansible shell: task is its own fresh bash process).
    ###########################################################################
    - name: Store TSIG values in Bitwarden
      when: not (is_staging | default(false) | bool)
      shell: |
        export BWS_ACCESS_TOKEN="{{ bw_token }}"

        upsert_secret() {
          local key="$1" value="$2"
          local ids
          ids=$(bws secret list "{{ bw_projectid }}" -o json | jq -r --arg key "$key" '.[] | select(.key == $key) | .id')

          if [ -z "$ids" ]; then
            bws secret create "$key" "$value" "{{ bw_projectid }}"
          else
            local first_id rest
            first_id=$(echo "$ids" | head -1)
            bws secret edit --value "$value" "$first_id"
            rest=$(echo "$ids" | tail -n +2)
            if [ -n "$rest" ]; then
              # shellcheck disable=SC2086
              bws secret delete $rest
            fi
          fi
        }

        upsert_secret "externaldns-tsig-name" "{{ tsig_key_name }}"
        upsert_secret "externaldns-tsig-algorithm" "{{ tsig_algorithm }}"
        upsert_secret "externaldns-tsig-secret" "{{ tsig_secret }}"
      args:
        executable: /bin/bash
      no_log: true

    ###########################################################################
    # 11. CREATE DNS ZONES FROM ZONE FILES (as Conditional Forwarder zones)
    # zones/import only adds records into a zone that already exists (its
    # "zone" param is the domain name, not the file to import -- confirmed
    # against a live instance, where it returned "No such zone was found").
    # Creating a zone directly from a zone file is done via zones/create
    # with the file sent as multipart field "zoneFile". The part MUST carry
    # a filename (dict form below) -- a plain string value gets sent as a
    # nameless multipart field, which Technitium silently accepts but
    # ignores, creating an empty zone with only default NS/SOA records
    # instead of importing the file's contents.
    #
    # type=Forwarder (not Primary) -- Technitium's own name for this is
    # "Conditional Forwarder": the zone still answers every record in the
    # zone file authoritatively, but any name that ISN'T explicitly defined
    # (e.g. home.example.com, hosted externally) is *supposed* to fall
    # through to the FWD record's target instead of returning NXDOMAIN. A
    # Primary zone can't do this -- being authoritative for a zone means
    # NXDOMAIN is final for anything not in it; the global `forwarders`
    # setting above (task 7) never gets consulted for a zone this server
    # already hosts.
    #
    # zones/create with type=Forwarder AND a zoneFile attached in the same
    # call creates the FWD record, then immediately DELETES it again as
    # part of the import step (Technitium clears the zone's existing NS/FWD
    # record before importing, same as it clears NS for a fresh Primary
    # zone) -- confirmed in WebServiceZonesApi.cs's CreateZoneAsync. Task
    # 11a below re-adds the FWD record afterward for that reason.
    #
    # CONFIRMED LIVE 2026-07-17, the hard way: the fallback-to-FWD path
    # above was never actually exercised end-to-end until now, and it was
    # broken. The zone file's own "IN NS ns1/ns2" records (needed only to
    # satisfy named-checkzone) were also being imported into the live zone,
    # and their presence made Technitium treat example.com as genuinely
    # self-delegated -- any name without an exact local record match hit
    # real self-referential recursive resolution (querying its own NS
    # records, i.e. itself) and failed instantly (<5ms, no forwarder
    # timeout even attempted), instead of using the FWD record. Every
    # externally-hosted name under all three zones (auth, www, vpn, mealie,
    # home.example.com, ...) was SERVFAILing. Task 11a2 below deletes
    # those NS records from the live zone after every import/create, which
    # fully fixed it -- verified by direct DNS queries against both ns1 and
    # ns2 before/after. See AI.md for the full incident writeup.
    #
    # The zone list is discovered from zone_dir rather than hardcoded, so
    # adding/removing a zone is just adding/removing a .zone file -- no
    # playbook edit needed. See AI.md.
    ###########################################################################
    - name: Discover zone files
      find:
        paths: "{{ zone_dir }}"
        patterns: "*.zone"
      register: zone_files_found

    - name: Compute zone names from discovered zone files
      set_fact:
        zone_names: "{{ zone_files_found.files | map(attribute='path') | map('basename') | map('regex_replace', '\\.zone$', '') | sort | list }}"

    - name: Create Technitium zones from zone files
      loop: "{{ zone_files_found.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      vars:
        zone_filename: "{{ item.path | basename }}"
        zone_name: "{{ zone_filename | regex_replace('\\.zone$', '') }}"
      uri:
        url: "{{ technitium_api }}/zones/create?zone={{ zone_name }}&type=Forwarder&forwarder={{ upstream_resolver_ip }}&protocol=Udp&dnssecValidation=false"
        method: POST
        headers:
          Authorization: "Bearer {{ technitium_api_key }}"
        body_format: form-multipart
        body:
          zoneFile:
            filename: "{{ zone_filename }}"
            content: "{{ lookup('file', item.path) }}"
            mime_type: text/plain
        status_code: 200

    ###########################################################################
    # 11a. RE-ADD THE FWD RECORD (zone-file import above deleted it)
    ###########################################################################
    - name: Re-add FWD record for split-DNS forwarding after zone file import
      loop: "{{ zone_names }}"
      loop_control:
        label: "{{ item }}"
      uri:
        url: "{{ technitium_api }}/zones/records/add?zone={{ item }}&domain={{ item }}&type=FWD&protocol=Udp&forwarder={{ upstream_resolver_ip }}&dnssecValidation=false"
        method: POST
        headers:
          Authorization: "Bearer {{ technitium_api_key }}"
        status_code: 200

    ###########################################################################
    # 11a2. DELETE THE ZONE FILE'S NS RECORDS (self-delegation breaks FWD)
    # The zone files carry "IN NS ns1/ns2" records only because
    # named-checkzone (make validate-zones) requires at least one NS record
    # per zone. Left live on a Forwarder zone, those NS records make
    # Technitium treat the zone as genuinely delegated to itself: any name
    # not explicitly in the zone file falls into real self-referential
    # recursive resolution (querying its own NS records, i.e. itself)
    # instead of using the FWD record above -- an instant SERVFAIL for
    # every name not locally defined (e.g. home.example.com, hosted on
    # Cloudflare). Confirmed live 2026-07-17: querying auth/www/vpn/mealie.
    # example.com all failed in <5ms (no forwarder timeout even attempted)
    # until these NS records were deleted, at which point every one
    # resolved correctly through the FWD path. See AI.md.
    ###########################################################################
    - name: Delete self-referential ns1 NS record from each zone
      loop: "{{ zone_names }}"
      loop_control:
        label: "{{ item }}"
      uri:
        url: "{{ technitium_api }}/zones/records/delete?zone={{ item }}&domain={{ item }}&type=NS&nameServer=ns1.{{ item }}"
        method: POST
        headers:
          Authorization: "Bearer {{ technitium_api_key }}"
        status_code: 200

    - name: Delete self-referential ns2 NS record from each zone
      loop: "{{ zone_names }}"
      loop_control:
        label: "{{ item }}"
      uri:
        url: "{{ technitium_api }}/zones/records/delete?zone={{ item }}&domain={{ item }}&type=NS&nameServer=ns2.{{ item }}"
        method: POST
        headers:
          Authorization: "Bearer {{ technitium_api_key }}"
        status_code: 200

    ###########################################################################
    # 11b. ENABLE DYNAMIC UPDATES (RFC2136) ON EACH ZONE
    # Zones default to update="Deny" -- the TSIG key existing globally
    # (task 9) is necessary but not sufficient; each zone also needs its own
    # update policy opened, or every dynamic update (from ExternalDNS, Kea
    # DHCP, ...) gets rejected before TSIG is even checked. Endpoint and
    # every field below verified directly against Technitium's own source
    # (DnsServerCore/WebServiceZonesApi.cs SetZoneOptions, and the update-
    # request handling in DnsServerCore/Dns/DnsServer.cs), not guessed:
    #
    #   - update=UseSpecifiedNetworkACL + updateNetworkACL: this is a
    #     coarse, IP-based gate checked BEFORE TSIG is considered at all --
    #     same internal ranges already used for recursionNetworkACL and
    #     zoneTransferAllowedNetworks. An update from outside these ranges
    #     is refused even with a valid TSIG signature.
    #   - updateSecurityPolicies: pipe-separated triples of
    #     tsigKeyName|domain|types, repeated. domain supports a "*.zone"
    #     prefix for wildcard matching at update time (confirmed in
    #     DnsServer.cs's policy-matching loop) -- covers every dynamically-
    #     named record ExternalDNS/Kea create (e.g. n8n.example.com)
    #     without enumerating hostnames that don't exist yet. Scoped to the
    #     record types those two systems actually write; deliberately
    #     excludes NS/SOA/DNSKEY etc.
    #
    #     DHCID is included alongside the record types ExternalDNS/Kea
    #     actually intend to write -- confirmed live (2026-07-17) that
    #     Kea's "check-with-dhcid" conflict-resolution mode (the OPNsense
    #     default) sends a DHCID record in the SAME update transaction as
    #     the A/AAAA record, to track which DHCP client owns a hostname.
    #     DNS UPDATE transactions are atomic: Technitium's own log showed
    #     it refusing the entire update ("DNS Server refused a zone UPDATE
    #     request [host.example.com DHCID IN] due to Dynamic Updates
    #     Security Policy") even though the A record in the same
    #     transaction would've been permitted on its own -- one
    #     disallowed record type in the transaction sinks the whole thing.
    #
    # Secondary zones (ns2) intentionally don't get this: updateSecurity
    # Policies is only valid on Primary/Forwarder zones in Technitium --
    # updates belong on the primary and reach ns2 via zone transfer, never
    # directly.
    ###########################################################################
    - name: Enable dynamic updates (RFC2136) on each zone
      loop: "{{ zone_names }}"
      loop_control:
        label: "{{ item }}"
      uri:
        url: "{{ technitium_api }}/zones/options/set"
        method: POST
        headers:
          Authorization: "Bearer {{ technitium_api_key }}"
        body_format: form-urlencoded
        body:
          zone: "{{ item }}"
          update: "UseSpecifiedNetworkACL"
          updateNetworkACL: "{{ update_network_acl }}"
          updateSecurityPolicies: "{{ tsig_key_name }}|*.{{ item }}|A,AAAA,CNAME,TXT,SRV,DHCID"
        status_code: 200

    ###########################################################################
    # 12. RESTART SERVICE
    ###########################################################################
    - name: Restart Technitium DNS service
      systemd:
        name: dns.service
        state: restarted

    # For optional DNS Apps (Advanced Blocking, Failover, Auto PTR, Log
    # Exporter, Query Logs backends, Weighted Round Robin, ...) see the
    # commented-out scaffold in configure-technitium-apps.yaml -- not run
    # here by default.

    - name: Confirm configuration applied
      debug:
        msg: "Technitium DNS Server fully configured with a fresh API key, TSIG keys, Bitwarden secrets, and GitOps automation."
