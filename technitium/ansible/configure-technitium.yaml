---
- name: Configure Technitium DNS Server declaratively (BWS version)
  hosts: localhost
  become: true

  vars:
    technitium_api: "http://localhost:5380/api"
    zone_path: "/opt/infra/technitium/zones"

  tasks:
    ###########################################################################
    # WAIT FOR TECHNITIUM API
    ###########################################################################
    - name: Wait for Technitium API to become available
      uri:
        url: "{{ technitium_api }}/status"
        method: GET
        status_code: 200
      register: api_status
      retries: 20
      delay: 3
      until: api_status.status == 200

    ###########################################################################
    # LOAD BITWARDEN SECRETS MANAGER ENVIRONMENT
    ###########################################################################
    - name: Load Bitwarden Secrets Manager environment variables
      shell: |
        export $(cat /root/bw.env | xargs)
      args:
        executable: /bin/bash

    ###########################################################################
    # CONFIGURE BWS CLI WITH ACCESS TOKEN
    ###########################################################################
    - name: Export Bitwarden Secrets Manager access token
      shell: |
        export BWS_ACCESS_TOKEN="$BW_TOKEN"
      args:
        executable: /bin/bash

    ###########################################################################
    # AUTO-GENERATE TSIG KEY IN TECHNITIUM
    ###########################################################################
    - name: Generate TSIG key in Technitium
      uri:
        url: "{{ technitium_api }}/tsig/add"
        method: POST
        body_format: json
        body:
          Name: "externaldns"
          Algorithm: "hmac-sha256"
          Secret: ""
        status_code: 200
      register: tsig_create

    - name: Extract TSIG values
      set_fact:
        tsig_name: "{{ tsig_create.json.Name }}"
        tsig_algorithm: "{{ tsig_create.json.Algorithm }}"
        tsig_secret: "{{ tsig_create.json.Secret }}"

    ###########################################################################
    # STORE TSIG VALUES IN BITWARDEN SECRETS MANAGER
    ###########################################################################
    - name: Store TSIG name in Bitwarden Secrets Manager
      shell: |
        bws secret create \
          --name "tsig-name" \
          --value "{{ tsig_name }}" \
          --project-id "$BW_PROJECTID"
      args:
        executable: /bin/bash

    - name: Store TSIG algorithm in Bitwarden Secrets Manager
      shell: |
        bws secret create \
          --name "tsig-algorithm" \
          --value "{{ tsig_algorithm }}" \
          --project-id "$BW_PROJECTID"
      args:
        executable: /bin/bash

    - name: Store TSIG secret in Bitwarden Secrets Manager
      shell: |
        bws secret create \
          --name "tsig-secret" \
          --value "{{ tsig_secret }}" \
          --project-id "$BW_PROJECTID"
      args:
        executable: /bin/bash

    ###########################################################################
    # CONFIGURE TECHNITIUM SETTINGS
    ###########################################################################
    - name: Configure upstream resolver (Unbound)
      uri:
        url: "{{ technitium_api }}/settings/set"
        method: POST
        body_format: json
        body:
          RecursiveDnsServers:
            - "172.16.10.1"
          EnableRecursion: true
          EnableDnsSecValidation: true
        status_code: 200

    - name: Configure ACLs
      uri:
        url: "{{ technitium_api }}/settings/set"
        method: POST
        body_format: json
        body:
          AllowRecursionFrom:
            - "172.16.0.0/12"
            - "192.168.200.0/20"
            - "192.168.0.0/17"
          AllowZoneTransferFrom:
            - "172.16.0.0/12"
            - "192.168.200.0/20"
            - "192.168.0.0/17"
        status_code: 200

    - name: Configure logging
      uri:
        url: "{{ technitium_api }}/settings/set"
        method: POST
        body_format: json
        body:
          EnableQueryLogging: true
          EnableApiLogging: true
        status_code: 200

    ###########################################################################
    # IMPORT ZONES
    ###########################################################################
    - name: Import zones
      loop:
        - example.com.zone
        - example.net.zone
        - storage.example.com.zone
      uri:
        url: "{{ technitium_api }}/zone/import"
        method: POST
        body_format: form-multipart
        body:
          zone: "{{ lookup('file', zone_path + '/' + item) }}"
          name: "{{ item | regex_replace('\\.zone$', '') }}"
        status_code: 200

    ###########################################################################
    # RESTART SERVICE
    ###########################################################################
    - name: Restart Technitium DNS service
      systemd:
        name: technitium.service
        state: restarted

    - name: Confirm configuration applied
      debug:
        msg: "Technitium DNS Server fully configured with auto-generated TSIG + Bitwarden Secrets Manager + GitOps."
