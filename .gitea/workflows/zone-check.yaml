name: Zone File Validation (Combined)

on:
  push:
    paths:
      - "dns/zones/**"
      - "dns/scripts/**"
      - "Makefile"
      - "hooks/**"
  pull_request:
    paths:
      - "dns/zones/**"
      - "dns/scripts/**"
      - "Makefile"
      - "hooks/**"
  # Lets this run on-demand against the current branch tip (Gitea's "re-run"
  # button re-executes the workflow as defined at the ORIGINAL commit, not
  # the latest version -- there was otherwise no way to validate a fix to
  # this file itself without an unrelated push to one of the paths above).
  workflow_dispatch:

jobs:
  zone-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          # terraform isn't in Ubuntu's default apt repos -- only available
          # via HashiCorp's own repo. Every zone-check run was failing here
          # ("E: Unable to locate package terraform") until this was added.
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          HASHICORP_REPO="deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main"
          echo "$HASHICORP_REPO" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y bind9-utils shellcheck yamllint terraform git-secrets

      # A fresh CI checkout never runs `make install-hooks` the way a
      # developer's local clone would, so .git/hooks/* don't exist yet --
      # verify-hooks.sh was failing here on every run once the apt fix above
      # let it get this far (previously masked entirely by that earlier
      # failure). git-secrets must be installed (apt, above) before this,
      # since install-hooks itself calls `git secrets --install`.
      - name: Install Git hooks
        run: |
          make install-hooks

      - name: Verify Git hook integrity
        run: |
          chmod +x hooks/verify-hooks.sh
          hooks/verify-hooks.sh

      - name: Run detect-secrets baseline validation
        run: |
          # Ubuntu 24.04's Python enforces PEP 668 (externally-managed-
          # environment) -- a plain `pip install` refuses to touch the
          # system Python. --break-system-packages is the standard escape
          # hatch for exactly this case (an ephemeral CI container with no
          # reason to preserve a "clean" system Python).
          pip install --break-system-packages detect-secrets
          detect-secrets-hook --baseline .detect-secrets.json

      - name: Run git-secrets scan
        run: |
          git secrets --scan

      - name: Run syntax validation (make validate-zones)
        run: |
          make validate-zones

      - name: Run strict zone diff checker
        run: |
          bash dns/scripts/zone-diff-strict.sh

      - name: Save diff output
        id: diff
        run: |
          bash dns/scripts/zone-diff.sh > diff_output.txt || true

      - name: Upload diff as artifact
        uses: actions/upload-artifact@v3
        with:
          name: zone-diff
          path: diff_output.txt

      - name: Validate Terraform (optional)
        run: |
          cd technitium/terraform
          terraform init -input=false
          terraform validate
